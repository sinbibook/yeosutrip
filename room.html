<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>여수 여수트립 펜션 - 객실안내</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="여수 여수트립 펜션 - 객실안내" />
  <meta property="og:description" content="여수의 엑스포,낭만포차 주요 관광지 인근에 위치하여 게스트하우스 처럼 편안하게 이용이 가능합니다, 커플 가족 친구 모두 여수에서 힐링하세요" />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/03/Iz7Kr8ihEU4X.jpg" />
  <meta property="og:url" content="https://yeosutrip.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="여수 여수트립 펜션 - 객실안내" />
  <meta name="twitter:description" content="여수의 엑스포,낭만포차 주요 관광지 인근에 위치하여 게스트하우스 처럼 편안하게 이용이 가능합니다, 커플 가족 친구 모두 여수에서 힐링하세요" />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/08/03/Iz7Kr8ihEU4X.jpg" />
  <meta name="naver-site-verification" content="6fc1af94d0fe8f9ae31a1faa8ec92e3728194a71" />
  <meta name="google-site-verification" content="XHsak670fWn434akeGlmPegCYSrMWkAHAobwqZBLcmI" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub2_2 sub_room sub_room_detail">
          <div class="sub_visual visual">
            <div class="visual_box">
              <div class="visual_txt">
                <p>Room Info</p>
                <strong data-room-name></strong>
              </div>
              <div class="visual_control">
                <div class="swiper-arw swiper-button-prev">←</div>
                <div class="swiper-pagination"></div>
                <div class="swiper-arw swiper-button-next">→</div>
              </div>
              <div class="swiper-container">
                <div class="swiper-wrapper" data-room-hero-slides></div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="inner">
              <ul data-room-nav>
                <li><a href="./layout-map.html">미리보기</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont inner">
            <div class="sub_title_box">
              <p data-room-lead></p>
              <h3 data-room-name></h3>
            </div>

            <div class="table_box">
              <!-- PC: 평형 열까지 노출 -->
              <div class="price_table for_pc">
                <table cellspacing="0" cellpadding="0" class="table_default">
                  <thead>
                    <tr>
                      <th style="width: 15%">객실명</th>
                      <th style="width: 5%">기준</th>
                      <th style="width: 5%">최대</th>
                      <th style="width: 20%">유형</th>
                      <th style="width: 20%">평형</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td scope="row" data-room-name></td>
                      <td data-room-base-occupancy></td>
                      <td data-room-max-occupancy></td>
                      <td data-room-structure></td>
                      <td data-room-size></td>
                    </tr>
                  </tbody>
                </table>
                <ul class="table_text" data-room-amenities-wrap>
                  <li>
                    <strong>집기품목</strong>
                    :
                    <span data-room-amenities></span>
                  </li>
                </ul>
              </div>

              <!-- 모바일: 평형 열을 빼고 4열로 -->
              <div class="price_table for_m">
                <table cellspacing="0" cellpadding="0" class="table_default">
                  <tbody>
                    <tr>
                      <td>객실명</td>
                      <td>기준</td>
                      <td>최대</td>
                      <td>유형</td>
                    </tr>
                    <tr>
                      <td data-room-name></td>
                      <td data-room-base-occupancy></td>
                      <td data-room-max-occupancy></td>
                      <td data-room-structure></td>
                    </tr>
                  </tbody>
                </table>
                <ul class="table_text" data-room-amenities-wrap>
                  <li>
                    <strong>집기품목</strong>
                    :
                    <span data-room-amenities></span>
                  </li>
                </ul>
              </div>
            </div>

            <div class="room_img_bnr">
              <ul data-room-gallery-top></ul>
              <p>
                Certainly, travel is more than the seeing of sights.
                <br />
                it is a change that goes on, deep and permanent, in the ideas of living.
              </p>
              <div class="btn_wrap">
                <a href="#!" class="btn_reserve" target="_blank" data-booking-link>예약하기</a>
              </div>
            </div>

            <div class="wide_img" data-room-wide-img><img src="data:," alt="" /></div>

            <!-- 객실 평면도 — 부가 정보라 이미지가 없으면 영역째 숨긴다
                 (layout-map 의 배치도는 그 페이지의 본 목적이라 반대로 자리를 유지한다) -->
            <div class="wide_img" data-room-floorplan-wrap>
              <div class="title_box">
                <h3>Room's Floor Plan</h3>
                <p data-property-caption="{name} 객실 평면도"></p>
              </div>
              <div data-room-floorplan-images></div>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->
    </div>

    <!-- 푸터는 #wrap(max-width:1920px) 밖에 둔다 — 어두운 배경이 화면 폭을 꽉 채우도록 -->
    <div id="footer-wrap"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/room-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/room.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
